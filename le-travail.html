const W=RAW.split('\n').map(l=>{const[t,fr,en]=l.split('|');return{t,fr,en,id:fr}});
const V=W.filter(w=>w.t==='v');
const PH=[
["Si les entreprises renforcent l’égalité entre les sexes, cela aide à augmenter la motivation ainsi que la productivité au bureau.","If companies strengthen gender equality, it helps increase motivation and productivity in the office."],
["Le travail à distance offre plus de flexibilité et favorise l’équilibre travail-vie personnelle.","Remote work offers more flexibility and supports work-life balance."],
["Une formation en ligne permet d’acquérir de nouvelles compétences techniques sans quitter la maison.","Online training lets you acquire new technical skills without leaving home."],
["Mon manager m’a assigné une mission importante avec un délai très court.","My manager assigned me an important assignment with a very short deadline."],
["Pour atteindre nos objectifs, il faut bien coordonner l’équipe et planifier chaque tâche.","To reach our goals, we must coordinate the team well and plan each task."],
["Le stress et la pression peuvent réduire l’efficacité des employés.","Stress and pressure can reduce employees’ effectiveness."],
["Les horaires flexibles contribuent au bien-être professionnel et à la satisfaction au travail.","Flexible hours contribute to professional well-being and job satisfaction."],
["Un bon leadership motive les collègues et améliore la communication au sein de l’équipe.","Good leadership motivates colleagues and improves communication within the team."],
["J’ai cinq ans d’expérience professionnelle dans ce secteur.","I have five years of professional experience in this sector."],
["Il est essentiel de respecter les délais et de signaler les problèmes à son superviseur.","It is essential to meet deadlines and report problems to your supervisor."],
["Un environnement favorable aide les employés à développer leur confiance en soi.","A supportive environment helps employees build their self-confidence."],
["Les entreprises qui investissent dans la formation de leurs employés obtiennent de meilleurs résultats.","Companies that invest in training their employees get better results."],
["Les conflits au travail se résolvent mieux grâce au partage d’informations et à une bonne négociation.","Conflicts at work are resolved better thanks to information sharing and good negotiation."],
["À mon avis, le salaire est important, mais l’accompagnement et le développement personnel le sont aussi.","In my opinion, salary is important, but support and personal development are too."],
["D’une part, un emploi stable est rassurant ; d’autre part, un travail temporaire peut être enrichissant.","On the one hand, a stable job is reassuring; on the other, temporary work can be enriching."],
["Pour réussir sa carrière, il faut être autonome, ponctuel et disponible.","To succeed in your career, you need to be independent, punctual and available."]];
// conjugation
const GR=['gérer','intégrer','compléter'];
const IR={};'apprendre:apprends,apprends,apprend,apprenons,apprenez,apprennent;acquérir:acquiers,acquiers,acquiert,acquérons,acquérez,acquièrent;soumettre:soumets,soumets,soumet,soumettons,soumettez,soumettent;suivre:suis,suis,suit,suivons,suivez,suivent;maintenir:maintiens,maintiens,maintient,maintenons,maintenez,maintiennent;obtenir:obtiens,obtiens,obtient,obtenons,obtenez,obtiennent;atteindre:atteins,atteins,atteint,atteignons,atteignez,atteignent;réduire:réduis,réduis,réduit,réduisons,réduisez,réduisent;résoudre:résous,résous,résout,résolvons,résolvez,résolvent'.split(';').forEach(s=>{const[a,b]=s.split(':');IR[a]=b.split(',')});
const PP={apprendre:'appris',acquérir:'acquis',soumettre:'soumis',suivre:'suivi',maintenir:'maintenu',obtenir:'obtenu',atteindre:'atteint',réduire:'réduit',résoudre:'résolu',dépendre:'dépendu'};
const FS={acquérir:'acquerr',maintenir:'maintiendr',obtenir:'obtiendr'};
const P=['je','tu','il/elle','nous','vous','ils/elles'],AV=['ai','as','a','avons','avez','ont'],FE=['ai','as','a','ons','ez','ont'];
function pres(b){if(IR[b])return IR[b];
 if(b.endsWith('er')){const s=b.slice(0,-2),g=GR.includes(b)?s.replace(/é([^é]*)$/,'è$1'):s;return[g+'e',g+'es',g+'e',s+(s.endsWith('g')?'eons':'ons'),s+'ez',g+'ent']}
 if(b.endsWith('ir')){const s=b.slice(0,-2);return[s+'is',s+'is',s+'it',s+'issons',s+'issez',s+'issent']}
 const s=b.slice(0,-2);return[s+'s',s+'s',s,s+'ons',s+'ez',s+'ent']}
const pp=b=>PP[b]||(b.endsWith('er')?b.slice(0,-2)+'é':b.endsWith('ir')?b.slice(0,-2)+'i':b.slice(0,-2)+'u');
const fs=b=>FS[b]||(b.endsWith('re')?b.slice(0,-1):b);
const el=(i,f,t)=>(i===0&&/^[aeiouhéèêâîô]/i.test(f)?'j’':P[i]+' ')+f+t;
function conj(v){const[b,...r]=v.split(' '),t=r.length?' '+r.join(' '):'';
 return[['Présent',pres(b).map((f,i)=>el(i,f,t))],['Passé composé',AV.map((a,i)=>el(i,a+' '+pp(b),t))],['Futur simple',FE.map((e,i)=>el(i,fs(b)+e,t))]]}
// helpers
const $=s=>document.querySelector(s);
let S;try{S=JSON.parse(localStorage.getItem('tv1'))}catch(e){}
S=S||{known:{},star:{},hist:[],wrong:{}};
const save=()=>{try{localStorage.setItem('tv1',JSON.stringify(S))}catch(e){}};
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function say(t,r=.9){try{const u=new SpeechSynthesisUtterance(t.replace(' / ',', '));u.lang='fr-CA';const vs=speechSynthesis.getVoices();const v=vs.find(v=>v.lang.replace('_','-')==='fr-CA')||vs.find(v=>v.lang.startsWith('fr'));if(v)u.voice=v;u.rate=r;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
const nz=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’']/g,"'").replace(/[^a-z' ]/g,' ').replace(/\s+/g,' ').trim();
const na=s=>s.replace(/^(un|une|le|la|les|des|l')\s*/,'');
const ok=(w,v)=>{v=na(nz(v));return v&&w.fr.split(' / ').some(a=>na(nz(a))===v)};
const pool=c=>c==='all'?W:c==='star'?W.filter(w=>S.star[w.id]):c==='todo'?W.filter(w=>!S.known[w.id]):c==='wrong'?W.filter(w=>S.wrong[w.id]):W.filter(w=>w.t===c);
const CATS=[['all','All'],['n','Nouns'],['v','Verbs'],['a','Adjectives'],['star','★ Starred'],['todo','Not known yet'],['wrong','My mistakes']];
const chips=(cur,a)=>`<div class="chips">${CATS.map(([k,l])=>`<button class="${cur===k?'on':''}" data-a="${a}" data-v="${k}">${l}</button>`).join('')}</div>`;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let T='study',ST={cat:'all',i:0,flip:0,dir:'fr',shuf:0,deck:null},QS={m:'mix',c:'all',n:10},Q=null,CV='gérer',rs=0;
function deck(){ST.deck=pool(ST.cat);if(ST.shuf)ST.deck=sh(ST.deck);ST.i=0;ST.flip=0}
const tn={n:'noun',v:'verb',a:'adjective'};
function study(){if(!ST.deck)deck();const d=ST.deck,w=d[ST.i];let h=chips(ST.cat,'cat');
 h+=`<div class="row"><button class="${ST.shuf?'on':''}" data-a="shuf">🔀 Shuffle</button><button data-a="dir">Front: ${ST.dir==='fr'?'French':'English'}</button><span class="mu g" style="text-align:right">${d.length?ST.i+1:0}/${d.length}</span></div>`;
 if(!w)return h+'<div class="card mu">No cards in this set yet.</div>';
 const fr=`<div class="big">${w.fr}</div><button class="ic" data-a="say" data-v="${w.fr}">🔊</button> <button class="ic" data-a="say" data-v="${w.fr}" data-r=".5">🐢 slow</button>`,en=`<div class="big">${w.en}</div>`;
 const front=ST.dir==='fr'?fr:en,back=ST.dir==='fr'?en:fr;
 h+=`<div class="card fc" data-a="flip"><div class="mu">${tn[w.t]}${S.known[w.id]?' · ✓ known':''}</div>${ST.flip?`${front}<hr style="width:60%;border:0;border-top:1px solid var(--bd)">${back}${w.t==='v'?`<button data-a="goconj" data-v="${w.fr}">Conjugate →</button>`:''}`:`${front}<div class="mu">tap to flip</div>`}</div>`;
 h+=`<div class="row"><button class="g" data-a="know" data-v="0">↻ Still learning</button><button class="g on" data-a="know" data-v="1">✓ I know it</button><button data-a="star">${S.star[w.id]?'★':'☆'}</button></div><div class="row"><button class="g" data-a="prev">← Prev</button><button class="g" data-a="next">Next →</button></div>`;
 const k=W.filter(x=>S.known[x.id]).length;return h+`<div class="mu">Known: ${k}/${W.length}</div>`}
function quiz(){if(Q&&Q.done)return qend();if(Q)return qview();
 const M=[['mix','Mixed'],['mcq_fe','MCQ: French → English'],['mcq_ef','MCQ: English → French'],['type_ef','Type the French (English → French)'],['listen','Listening: hear it, pick the meaning'],['speak','Pronunciation: say it aloud']];
 const n=pool(QS.c).length;
 return `<div class="card"><p class="mu">Activity</p><select id="qm">${M.map(([k,l])=>`<option value="${k}" ${QS.m===k?'selected':''}>${l}</option>`).join('')}</select><p class="mu">Words from</p><select id="qc">${CATS.map(([k,l])=>`<option value="${k}" ${QS.c===k?'selected':''}>${l} (${pool(k).length})</option>`).join('')}</select><p class="mu">Number of questions</p><input id="qn" type="number" min="1" max="${W.length}" value="${QS.n}"><div class="row"><button class="on g" data-a="qstart" ${n<4?'disabled':''}>Start quiz</button></div>${n<4?'<p class="mu">Pick a set with at least 4 words.</p>':''}</div>`}
function qnext(){if(Q.i>=Q.list.length){Q.done=1;S.hist.unshift({d:new Date().toLocaleDateString(),s:Q.sc,n:Q.list.length,m:Q.mode});S.hist=S.hist.slice(0,15);save();return render()}
 const w=Q.list[Q.i];let m=Q.mode;if(m==='mix')m=sh(SR?['mcq_fe','mcq_ef','listen','type_ef','speak']:['mcq_fe','mcq_ef','listen','type_ef'])[0];
 const c=Q.cur={w,m,fb:0};if(m.startsWith('mcq')||m==='listen')c.o=sh([w,...sh(W.filter(x=>x.t===w.t&&x.id!==w.id&&x.en!==w.en&&x.fr!==w.fr)).slice(0,3)]);
 render();if(m==='listen')say(w.fr)}
function grade(g){const c=Q.cur;c.fb=g?1:2;if(g){Q.sc++;delete S.wrong[c.w.id]}else S.wrong[c.w.id]=1;save();render()}
function qview(){const c=Q.cur,w=c.w,m=c.m,f=m==='mcq_ef'?'fr':'en';
 let h=`<div class="mu">Question ${Q.i+1}/${Q.list.length} · score ${Q.sc}</div><div class="card">`;
 const sp=`<button class="ic" data-a="say" data-v="${w.fr}">🔊</button>`;
 if(m==='mcq_fe')h+=`<div class="big">${w.fr} ${sp}</div><p class="mu">What does it mean?</p>`;
 if(m==='mcq_ef')h+=`<div class="big">${w.en}</div><p class="mu">Choose the French</p>`;
 if(m==='listen')h+=`<div class="big">${sp} 🎧</div><p class="mu">Listen, then choose the meaning</p>`;
 if(m==='type_ef')h+=`<div class="big">${w.en}</div><p class="mu">Type the French (articles optional, accents forgiven)</p>${c.fb?`<p>You typed: ${c.typed||'—'}</p>`:'<input id="ta" type="text" autocapitalize="off" autocomplete="off" autocorrect="off">'}`;
 if(m==='speak')h+=`<div class="big">${w.en}</div><p class="mu">Say it in French${c.heard?` · heard: “${c.heard}”`:''}</p>`;
 if(c.o)h+=c.o.map(o=>`<button class="opt ${c.fb?(o[f]===w[f]?'ok':o[f]===c.pick?'no':''):''}" data-a="qopt" data-v="${o[f]}" ${c.fb?'disabled':''}>${o[f]}</button>`).join('');
 if(!c.fb){if(m==='type_ef')h+=`<button class="on" data-a="qchk">Check</button>`;
  if(m==='speak'){if(SR&&!c.rev)h+=`<div class="row"><button class="on g" data-a="qmic">🎤 Speak</button><button data-a="qrev">Self-check</button></div>${c.err?'<p class="mu">Couldn’t hear you. Try again or self-check.</p>':''}`;else h+=`<p>Say it, then listen: ${sp}</p><div class="big">${w.fr}</div><div class="row"><button class="g on" data-a="qself" data-v="1">I said it right</button><button class="g" data-a="qself" data-v="0">Not quite</button></div>`}}
 else h+=`<p class="${c.fb===1?'':'mu'}">${c.fb===1?'✅ Correct!':'❌ Answer:'} <b>${w.fr}</b> — ${w.en} ${sp}</p><button class="on" data-a="qnext">${Q.i+1>=Q.list.length?'Finish':'Next →'}</button>`;
 return h+'</div><button data-a="qquit">Quit</button>'}
function qend(){const p=Math.round(Q.sc/Q.list.length*100),wr=Object.keys(S.wrong).length;
 return `<div class="card"><div class="big">${Q.sc}/${Q.list.length} · ${p}%</div><p>${p>=80?'Très bien !':p>=50?'Pas mal, keep going.':'Keep practising, you’ll get there.'}</p><div class="row"><button class="on" data-a="qnew">New quiz</button>${wr?`<button data-a="qrw">Review my mistakes (${wr})</button>`:''}</div></div>`}
function conjv(){return `<select id="cv">${V.map(v=>`<option ${v.fr===CV?'selected':''}>${v.fr}</option>`).join('')}</select><p class="mu">${V.find(v=>v.fr===CV).en} · tap a line to hear it</p>`+conj(CV).map(([n,r])=>`<div class="card"><b>${n}</b><div class="tb">${r.map(x=>`<button data-a="say" data-v="${x}">${x}</button>`).join('')}</div></div>`).join('')}
function phr(){return `<p class="mu">Useful sentences for the theme “le travail”. Tap 🔊 to listen.</p>`+PH.map(([f,e])=>`<div class="card"><div>${f}</div><div class="mu">${e}</div><button class="ic" data-a="say" data-v="${f}">🔊</button> <button class="ic" data-a="say" data-v="${f}" data-r=".6">🐢</button></div>`).join('')}
function prog(){const r=(l,w)=>{const a=w.length,k=w.filter(x=>S.known[x.id]).length;return `<p>${l}: ${k}/${a}</p><div class="bar"><i style="width:${a?k/a*100:0}%"></i></div>`};
